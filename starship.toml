"$schema" = 'https://starship.rs/config-schema.json'

# Claude Code status line (`starship statusline claude-code`)
[profiles]
claude-code = "$claude_model$git_branch$claude_context$claude_cost"

# Context window usage in the Claude Code status line, e.g. "▓▓▓░░░░░░░ 27% 54k/200k".
# Default hides the module below 30%; these thresholds keep it always visible.
[claude_context]
format = "[$gauge $percentage $input_tokens/$total_tokens]($style) "
gauge_width = 10
gauge_full_symbol = "▓"
gauge_partial_symbol = "▓"
gauge_empty_symbol = "░"

[[claude_context.display]]
threshold = 0.0
style = "bold green"

[[claude_context.display]]
threshold = 60.0
style = "bold yellow"

[[claude_context.display]]
threshold = 80.0
style = "bold red"

