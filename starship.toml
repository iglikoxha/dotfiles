# Python version uv resolves for the current dir, not the system python3. Uses
# `uv python find --show-version`, which picks the first match of:
#   1. an activated venv ($VIRTUAL_ENV)
#   2. a .venv in the current dir or any parent
#   3. uv-managed Pythons, then Pythons on PATH, filtered by .python-version /
#      requires-python when present
# It does this WITHOUT creating or syncing a venv, so it works even before the
# first `uv sync`. The whole format is wrapped in ( ) so it renders nothing when
# uv can't resolve a version. Shows in the default $custom slot.
[custom.venv_python]
description = "Python version uv resolves for the current project"
detect_files = ["pyproject.toml", "uv.lock", ".python-version"]
detect_folders = [".venv"]
detect_extensions = ["py"]
shell = ["sh"]
command = "uv python find --show-version --no-python-downloads 2>/dev/null"
symbol = " "
format = '([${symbol}v$output \(uv\) ]($style))'                            # no "via " prefix, like the built-in modules
style = "yellow bold"
